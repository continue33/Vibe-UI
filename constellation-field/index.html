<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Constellation Field</title>
    <style>
      html, body { margin: 0; height: 100%; background: #010100; }
      #field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .hint {
        position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
        color: rgba(220, 210, 255, 0.55); font: 13px/1.4 system-ui, sans-serif;
        letter-spacing: 0.08em; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="hint">Constellation Field · move your cursor</div>
    <script type="module">
      import { createConstellationField } from "./constellation-field.js";
      createConstellationField(document.getElementById("field"));
    </script>
  </body>
</html>
